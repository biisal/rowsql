# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello from RowSQL!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  backend-build:
    desc: build backend application
    cmds:
      - go run ./cmd/schema/main.go
      - go build -o bin/rowsql ./cmd/server
  frontend-build:
    desc: build frontend application
    cmds:
      - cd ./frontend && pnpm run build

  backend-dev:
    desc: run backend server in development mode
    cmds:
      - air -c air.toml

  frontend-dev:
    desc: run frontend server in development mode
    cmds:
      - cd ./frontend/ && pnpm run dev

  dev:
    desc: Run the application in development mode
    deps: [backend-dev, frontend-dev]

  build:
    desc: build frontend and backend
    cmds:
      - task: doc
      - task: backend-build
      - task: frontend-build
      - echo "build was successful"

  run:
    desc: Run the application
    deps: [build]
    cmds:
      - ./bin/rowsql
  doc:
    desc: generate documentation
    cmds:
      - go run ./cmd/schema/...
  test:
    desc: test the application
    cmds:
      - go test ./... -failfast

  release:
    desc: make a release for test
    cmds:
      - goreleaser release --clean --snapshot

  lint:
    desc: Run linter only
    cmds:
      - golangci-lint run
      - cd ./frontend && pnpm lint

  clean:
    desc: Clean build artifacts and dependencies
    cmds:
      - rm -rf dist/
      - rm -rf bin/
      - rm -rf tmp/
      - rm -rf frontend/dist/
      - rm -rf frontend/node_modules/

  install:
    desc: Install dependencies
    cmds:
      - go mod download
      - cd ./frontend && pnpm install
